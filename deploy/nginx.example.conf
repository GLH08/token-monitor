# 宿主机反向代理示例配置 (Nginx HTTPS 转发)
# 该版本使用 Nginx 1.25.1+ 新版 HTTP/2 指令写法 (http2 on;)
# 将此文件引入主 nginx.conf, 或放至 conf.d/ 下

server {
    listen 80;
    server_name your_domain.com; # 请替换为实际域名

    # 强制重定向至 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name your_domain.com; # 请替换为实际域名

    # 开启 HTTP/2 特性支持 (Nginx 最新标准独立写法)
    http2 on;

    # SSL 证书配置 (请替换为实际路径)
    ssl_certificate     /etc/nginx/ssl/your_domain.com.crt;
    ssl_certificate_key /etc/nginx/ssl/your_domain.com.key;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # 包含现代安全 Header
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options nosniff;

    # ==========================================
    # 核心网关代理 (映射到主机的 5173 端口)
    # 因为 Docker 配置文件将应用端口抛出为 5173
    # ==========================================
    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        
        # 处理 WebSocket Upgrade 请求
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_read_timeout 86400;  # 设置长时拉流超时，防止 WebSocket 轻易被挂断
    }
}
