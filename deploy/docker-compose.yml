version: '3.8'

services:
  monitor:
    image: ghcr.io/glh08/token-monitor:latest
    container_name: token-monitor
    restart: always
    ports:
      - "5173:3000"
    environment:
      # 数据库连接 (如果是外部 DB)
      # DATABASE_URL: mysql://用户名:密码@IP地址:3306/数据库名
      DATABASE_URL: ${DATABASE_URL}
      ACCESS_PASSWORD: ${ACCESS_PASSWORD}
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_TOKEN_TTL_SECONDS: ${AUTH_TOKEN_TTL_SECONDS:-28800}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      QUOTA_PER_UNIT: ${QUOTA_PER_UNIT:-500000}
      MAX_MONITOR_MODELS: ${MAX_MONITOR_MODELS:-50}
      DATA_RETENTION_DAYS: ${DATA_RETENTION_DAYS:-90}
      SYNC_MAX_BATCHES_PER_RUN: ${SYNC_MAX_BATCHES_PER_RUN:-100}
      NODE_ENV: production
    volumes:
      - monitor-data:/app/data

volumes:
  monitor-data:
