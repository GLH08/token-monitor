version: '3.8'

services:
  monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: token-monitor
    restart: always
    ports:
      - "5173:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      ACCESS_PASSWORD: ${ACCESS_PASSWORD:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      QUOTA_PER_UNIT: ${QUOTA_PER_UNIT:-500000}
      MAX_MONITOR_MODELS: ${MAX_MONITOR_MODELS:-50}
      NODE_ENV: production
    volumes:
      - monitor-data:/app/data

volumes:
  monitor-data:
